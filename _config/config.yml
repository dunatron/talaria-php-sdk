---
Name: talaria-logging
After:
  - '#corelogging'
---
SilverStripe\Core\Injector\Injector:
  Talaria\TalariaClient:
    factory: Talaria\SilverStripe\InjectorFactory
  # Deprecated alias — prefer Talaria\TalariaClient
  Talaria\Client:
    factory: Talaria\SilverStripe\InjectorFactory
  # Neutral service id — never name this after a concrete handler class.
  # Factory require_once's TalariaLogHandlerMonolog3 or …MonologLegacy only.
  talariaLogHandler:
    factory: Talaria\SilverStripe\LogHandlerFactory
  Psr\Log\LoggerInterface:
    calls:
      PushTalariaHandler: [ pushHandler, [ '%$talariaLogHandler' ] ]

Talaria\SilverStripe\Config:
  dsn: '`TALARIA_DSN`'
  apiKey: '`TALARIA_API_KEY`'
  environment: '`TALARIA_ENVIRONMENT`'
  release: '`TALARIA_RELEASE`'
  minLevel: warning
  maxBatchSize: 50
  flushIntervalMs: 2000
  sampleRate: 1.0
  enableBrowserCms: true
  enableBrowserFrontend: true
  browserSdkVersion: '0.1.12'
