---
Name: talaria-logging-browser
After:
  - '#talaria-logging'
---
SilverStripe\Admin\LeftAndMain:
  extensions:
    - Talaria\SilverStripe\LeftAndMainExtension

SilverStripe\CMS\Controllers\ContentController:
  extensions:
    - Talaria\SilverStripe\FrontendExtension

Talaria\SilverStripe\Config:
  enableBrowserCms: true
  enableBrowserFrontend: true
  # Published npm package: https://www.npmjs.com/package/@newtalaria/browser
  browserSdkVersion: '0.1.6'
  # Replay sample rates default to 0 in PHP (Config::toBrowserOptions).
  # Do not set 0 here — that can overwrite app YAML depending on merge order.
